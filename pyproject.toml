[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langkit"
version = "0.1.0"
description = "Toolkit for building constructed languages"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8",
    "termcolor>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["langkit"]

[tool.pytest.ini_options]
testpaths = ["langkit/tests"]
