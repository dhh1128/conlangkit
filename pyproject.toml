[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conlangkit"
dynamic = ["version"]
description = "A Python toolkit for building constructed languages: glossary format & search, base-form reduction, POS tagging, and orthography."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Hardman", email = "daniel.hardman@gmail.com" }]
keywords = [
    "conlang",
    "constructed-language",
    "linguistics",
    "glossary",
    "nlp",
    "orthography",
    "phonology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "nltk>=3.8",
    "termcolor>=2.0",
]

[project.scripts]
clk = "conlangkit.app:main"

[project.urls]
Homepage = "https://github.com/dhh1128/conlangkit"
Repository = "https://github.com/dhh1128/conlangkit"
Issues = "https://github.com/dhh1128/conlangkit/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.hatch.version]
path = "src/conlangkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/conlangkit"]

[tool.hatch.build.targets.sdist]
include = ["/src/conlangkit", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["src/conlangkit/tests"]
addopts = "-ra --strict-markers --cov=conlangkit --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# A pragmatic set for a legacy codebase: pyflakes (F), a curated pycodestyle
# subset (E4/E7/E9), import sorting (I), and pyupgrade (UP). Deliberately not
# strict yet — the adversarial review panel drives the deeper idiom cleanup.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# F403/F405 (star imports): the codebase leans on `from .ui import *` and
# `from ... import *` throughout the tests as a deliberate idiom. Flagged for
# the review panel as a cleanup target rather than churned mechanically here.
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# Documented tech-debt markers (legacy idioms), not blanket suppressions.
"src/conlangkit/**/__init__.py" = ["F401"]
"src/conlangkit/commands/repl.py" = ["E722"]        # legacy bare excepts
"src/conlangkit/phoneme.py" = ["UP007", "UP045"]    # experimental module (README caveat)
"src/conlangkit/syllable.py" = ["UP007", "UP045"]   # experimental module (README caveat)
"src/conlangkit/tests/**" = ["E722", "E741"]        # test-only idioms

[tool.mypy]
python_version = "3.10"
files = ["src/conlangkit"]
# Third-party libs without type stubs.
ignore_missing_imports = true
# Pragmatic baseline: this is untyped legacy code. Type-checking is a ratchet —
# we start lenient (real type *conflicts* only) and tighten over time.
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Experimental phonotactics (partially broken; see README) + the legacy terminal
# UI helpers. On the type-tightening backlog; not blocking the type gate yet.
module = ["conlangkit.phoneme", "conlangkit.syllable", "conlangkit.ui"]
ignore_errors = true

[tool.coverage.run]
source = ["conlangkit"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
# Baseline after the targeted-coverage pass is ~75% (branch); the library API
# modules sit at 82-100%, the remainder is the interactive REPL/CLI. This floor
# is a ratchet on newly added code — raise it as coverage improves.
fail_under = 75
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
